  <circle cx="44" cy="46" r="3.2" fill="url(#win)"/><circle cx="54" cy="46" r="3.2" fill="url(#win)"/>
  <circle cx="64" cy="46" r="3.2" fill="url(#win)"/><circle cx="74" cy="46" r="3.2" fill="url(#win)"/>
